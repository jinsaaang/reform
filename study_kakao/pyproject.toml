[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hgf-public-reproduction"
version = "2.0.0"
description = "Public Hindsight-Guided Forecasting reproduction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai==2.48.0",
  "python-dotenv==1.2.2",
]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[project.scripts]
hgf-evaluate = "hgf.evaluate:main"
hgf-build-exemplars = "hgf.build_exemplars:main"
hgf-build-memory = "hgf.build_memory:main"
hgf-main-table = "hgf.cli:main_table_main"
hgf-manifest = "hgf.manifest:main"
hgf-preflight = "hgf.preflight:main"
hgf-replay = "hgf.cli:replay_main"
hgf-verify = "hgf.verify:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
