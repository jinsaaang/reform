[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hgf-original-legacy"
version = "1.0.0"
description = "Executable archive of the original HGF implementation"
requires-python = ">=3.11"
dependencies = [
  "openai==2.48.0",
  "python-dotenv==1.2.2",
]

[project.scripts]
hgf-legacy-replay = "hgf.cli:replay_main"
hgf-legacy-main-table = "hgf.cli:main_table_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
