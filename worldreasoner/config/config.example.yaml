# WorldReasoner Configuration

# Database (SQLite)
database:
  db_path: worldreasoner.db  # Path to SQLite database file
  batch_size: 100             # Batch insert size for bulk operations
  timeout: 5.0                # Connection timeout in seconds

# Server Configuration
server:
  # Backend API server (FastAPI visualization backend)
  host: localhost
  port: 8300

  # MCP forecasting server (used by agents for forecasting)
  mcp_host: localhost
  mcp_port: 8301

  reload: true
  log_level: info

# LLM
llm:
  model: google/gemini-2.5-flash
  embedding_model: openai/text-embedding-3-small
  review_model: google/gemini-2.5-flash
  api_base: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  app_name: WorldReasoner
  temperature: 1.0
