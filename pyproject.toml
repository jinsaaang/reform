[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "procedural-topology-hgf"
version = "1.6.3"
description = "Canonical Procedural Topology HGF reproduction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai==2.48.0",
  "pydantic>=2.7,<3",
  "python-dotenv==1.2.2",
]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[tool.pytest.ini_options]
pythonpath = [
  "hgf_final/method_src",
  "hgf_final/hgf_historical_base_src",
  "hgf_final/input_adapter_src",
  "hgf_final/execution_src",
]
testpaths = ["tests"]
addopts = "-q -s -p no:cacheprovider"

